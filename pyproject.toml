[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "kite-passport-runtime"
version = "0.2.0"
description = "A bounded Python host adapter for the official kpass CLI"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<49"]
[tool.setuptools.packages.find]
where = ["src"]
